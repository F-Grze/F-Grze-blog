<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · 页面走丢了 | F-Grze の光影日志</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/blog/favicon.svg" type="image/svg+xml">
<style>
  :root { --ink:#fff; --paper:#111; --muted:#6b7280; --line:#e3e3e1; --accent:#b45309; }
  @media (prefers-color-scheme: dark) { :root { --ink:#0a0a0a; --paper:#f2f1ef; --muted:#a3a29e; --line:#2c2c2a; --accent:#e7a45c; } }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100svh; display: grid; place-items: center;
    background: var(--ink); color: var(--paper); padding: 2rem;
    font-family: Georgia, "Songti SC", "Noto Serif SC", "PingFang SC", serif;
    background-image: linear-gradient(rgba(127,127,127,.06) 1px, transparent 1px), linear-gradient(90deg, rgba(127,127,127,.06) 1px, transparent 1px);
    background-size: 32px 32px;
  }
  main { max-width: 34rem; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: .6875rem; letter-spacing: .26em; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: clamp(4rem, 18vw, 8rem); font-style: italic; line-height: .9; letter-spacing: -.05em; margin: 1rem 0 .5rem; }
  p { color: var(--muted); line-height: 1.8; }
  .rule { height: 1px; background: var(--line); margin: 1.75rem 0; }
  a { color: var(--paper); text-decoration: none; border-bottom: 1px solid var(--accent); padding-bottom: 2px; }
  a:hover { color: var(--accent); }
  .links { display: flex; gap: 1.25rem; flex-wrap: wrap; font-size: .9375rem; }
</style>
</head>
<body>
<main>
  <div class="mono">// ERROR 404 · PAGE NOT FOUND</div>
  <h1>走丢了</h1>
  <p>这个地址没有对应的页面。可能是链接改过，也可能是我把文件放错了柜子。</p>
  <div class="rule"></div>
  <div class="links">
    <a href="/blog/">回首页</a>
    <a href="/blog/posts/">文章归档</a>
    <a href="/blog/feed.xml">RSS</a>
  </div>
</main>
</body>
</html>
